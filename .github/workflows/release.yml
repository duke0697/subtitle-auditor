name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # prerelease tags (v1.2.3-rc.1) must not become the stable /releases/latest
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: npm ci

      - name: Build sidecar
        run: |
          npm run setup:sidecar
          npm run build:sidecar

      - run: npm run fetch:ffmpeg

      - name: Set version from tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm run typecheck

      - run: npm run build

      - name: Package installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Verify local artifacts
        shell: bash
        run: |
          test -f dist/latest.yml
          test -f dist/win-unpacked/resources/app-update.yml
          grep -q "version: ${GITHUB_REF_NAME#v}" dist/latest.yml
          ls dist/SubtitleAuditor-Setup-*.exe dist/SubtitleAuditor-Setup-*.exe.blockmap

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=$(cat <<EOF
          ## 字幕校对台 ${GITHUB_REF_NAME}

          ### 更新
          - 导出报告的默认文件名改为「视频名 + 审查报告」，便于与源视频对应

          ### 说明
          - 分析、OCR、模型下载运行中会阻止重启安装，避免丢失审查结果
          - 安装包未签名，首次安装可能出现 SmartScreen 提示
          EOF
          )
          gh release create "$GITHUB_REF_NAME" \
            dist/SubtitleAuditor-Setup-*.exe \
            dist/latest.yml \
            dist/SubtitleAuditor-Setup-*.exe.blockmap \
            --title "字幕校对台 ${GITHUB_REF_NAME}" \
            --notes "$notes" \
            --draft \
            --verify-tag

      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' > assets.txt
          grep -q "^latest.yml$" assets.txt
          grep -q "\.exe$" assets.txt
          grep -q "\.blockmap$" assets.txt

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
