name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # prerelease tags (v1.2.3-rc.1) must not become the stable /releases/latest
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: npm ci

      - name: Build sidecar
        run: |
          npm run setup:sidecar
          npm run build:sidecar

      - run: npm run fetch:ffmpeg

      - name: Set version from tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm run typecheck

      - run: npm run build

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish always

      - name: Verify update metadata
        shell: bash
        run: |
          test -f dist/latest.yml
          test -f dist/win-unpacked/resources/app-update.yml
          grep -q "version: ${GITHUB_REF_NAME#v}" dist/latest.yml
