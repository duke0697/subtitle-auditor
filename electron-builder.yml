appId: com.boss.subtitleauditor
productName: 字幕校对台
executableName: SubtitleAuditor
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: resources/sidecar
    to: sidecar
  - from: resources/ffmpeg
    to: ffmpeg
  - from: resources/model-manifests
    to: model-manifests
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icons/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 字幕校对台
  artifactName: SubtitleAuditor-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false
